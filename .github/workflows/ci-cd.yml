name: HelpDesk CI-CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  verify:

    name: Test and build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q helpdesk analytics database

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js

      - name: Build Docker image
        run: |
          docker build -t helpdesk:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name helpdesk-ci \
            -p 127.0.0.1:8000:8000 \
            helpdesk:ci

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
                http://127.0.0.1:8000/openapi.json \
                > /dev/null; then
              echo "API is ready"
              break
            fi

            sleep 1
          done

          curl --fail --silent \
            http://127.0.0.1:8000/openapi.json \
            > /dev/null

      - name: Check frontend availability
        run: |
          curl --fail --silent \
            http://127.0.0.1:8000/ui/ \
            > /dev/null

          curl --fail --silent \
            http://127.0.0.1:8000/ui/app.js \
            > /dev/null

      - name: Run API scenarios
        run: |
          python -m helpdesk.api_scenarios

      - name: Run API acceptance checks
        run: |
          python analytics/17_acceptance_check.py

      - name: Install API testing dependencies
        run: |
          python -m pip install pytest requests

      - name: Run HTTP API tests
        run: |
          python -m pytest tests/test_http_api.py -v

      - name: Save tested Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker save helpdesk:ci \
            | gzip > helpdesk-image.tar.gz

      - name: Upload tested Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-image
          path: helpdesk-image.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Show container logs
        if: always()
        run: |
          docker logs helpdesk-ci || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f helpdesk-ci || true


  publish:

    name: Publish release image

    needs: verify

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: helpdesk-image

      - name: Load Docker image
        run: |
          docker load -i helpdesk-image.tar.gz

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io \
                -u "$GITHUB_ACTOR" \
                --password-stdin

      - name: Publish versioned image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="$GITHUB_REF_NAME"

          docker tag helpdesk:ci "$IMAGE:$VERSION"

          docker push "$IMAGE:$VERSION"

          echo "Published: $IMAGE:$VERSION"